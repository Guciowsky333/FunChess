services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  web:
    build: .
    command: >
      sh -c "
      uv run python manage.py migrate &&
      uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - web_venv:/app/.venv
    env_file:
      - .env
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: uv run celery -A config worker -l info
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - db
      - redis
    env_file:
      - .env
volumes:
  postgres_data:
  web_venv:
