[project]
name = "funchess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kacper kubiak", email = "kacperkubiak.magik@wp.pl" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

